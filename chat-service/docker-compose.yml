version: "3.9"

services:
  chat-service:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - mockstack

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mock
      POSTGRES_PASSWORD: mock
      POSTGRES_DB: mockstack
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - mockstack

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - mockstack

volumes:
  pg_data:

networks:
  mockstack:
    name: mockstack-network
