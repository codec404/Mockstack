version: "3.9"

services:
  workers:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - mockstack

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mock
      POSTGRES_PASSWORD: mock
      POSTGRES_DB: mockstack
    networks:
      - mockstack

  redis:
    image: redis:7
    networks:
      - mockstack

networks:
  mockstack:
    name: mockstack-network
