syntax = "proto3";

package interviewengine;

service InterviewEngineService {
  rpc GenerateNextQuestion(GenerateNextQuestionRequest) returns (GenerateNextQuestionResponse);
  rpc EvaluateAnswer(EvaluateAnswerRequest) returns (EvaluateAnswerResponse);
  rpc FinalizeInterviewReport(FinalizeInterviewReportRequest) returns (FinalizeInterviewReportResponse);
}

message GenerateNextQuestionRequest {
  string interview_id = 1;
  string domain = 2;
  string difficulty = 3;
  string experience_level = 4;
  repeated string tech_stacks = 5;
  string transcript = 6;
}

message GenerateNextQuestionResponse {
  string question = 1;
}

message EvaluateAnswerRequest {
  string interview_id = 1;
  string question = 2;
  string answer = 3;
  string domain = 4;
  string difficulty = 5;
}

message EvaluateAnswerResponse {
  int32 score = 1;
  int32 clarity = 2;
  repeated string positives = 3;
  repeated string negatives = 4;
  repeated string weak_topics = 5;
  repeated string improvement_points = 6;
  string next_question = 7;
}

message FinalizeInterviewReportRequest {
  string interview_id = 1;
  repeated int32 scores = 2;
  repeated int32 clarity_scores = 3;
  repeated string positives = 4;
  repeated string negatives = 5;
  repeated string weak_topics = 6;
  repeated string improvement_points = 7;
}

message FinalizeInterviewReportResponse {
  int32 average_score = 1;
  int32 clarity_score = 2;
  repeated string strengths = 3;
  repeated string weaknesses = 4;
  repeated string weak_topics = 5;
  repeated string improvement_points = 6;
  string summary = 7;
}
