version: "3.9"

services:
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    networks:
      - mockstack

networks:
  mockstack:
    name: mockstack-network
